<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Project 280</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1f1f1f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root{
    --ink:#1f1f1f;
    --paper:#fffdf9;
    --line:rgba(0,0,0,0.12);
    --accent:#256c94;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
    background:var(--paper);
    color:var(--ink);
    padding-bottom:90px;
  }
  header{
    position:sticky; top:0; z-index:10;
    background:var(--paper);
    border-bottom:1px solid var(--line);
    padding:14px 16px 10px;
  }
  h1{ font-size:19px; margin:0 0 10px; letter-spacing:-0.3px; }
  #search{
    width:100%;
    padding:11px 14px;
    font-size:15px;
    border:1.5px solid var(--line);
    border-radius:10px;
    outline:none;
  }
  #search:focus{ border-color:var(--accent); }
  #filterBar{ margin-top:10px; }
  .filter-group-label{
    font-size:10px; font-weight:700; text-transform:uppercase;
    letter-spacing:0.4px; color:#999 !important; margin:8px 0 4px;
  }
  #tagBar, #sysBar{
    display:flex; gap:6px; flex-wrap:wrap;
  }
  .tag-btn{
    font-size:12px; padding:5px 10px; border-radius:999px;
    border:1px solid var(--line); background:#fff; cursor:pointer;
    color:var(--ink);
  }
  .tag-btn.active{ background:var(--ink); color:#fff !important; border-color:var(--ink); }
  .tag-btn.sys-btn.active{ background:var(--accent); border-color:var(--accent); }
  #status{ font-size:12px; color:#888; padding:8px 16px 0; }
  #list{ padding:10px 12px; }
  .card{
    background:#fff;
    border:1px solid var(--line);
    border-radius:12px;
    padding:12px 14px;
    margin-bottom:10px;
    cursor:pointer;
  }
  .card:active{ background:#f5f4ef; }
  .card-title{ font-weight:700; font-size:15px; margin-bottom:4px; }
  .card-tags{ display:flex; gap:5px; flex-wrap:wrap; }
  .chip{
    font-size:10.5px; padding:2px 8px; border-radius:999px;
    background:#eef0e8; color:#444 !important;
  }
  .chip-sys{ background:#dbe7ee; color:#1b5170 !important; }
  .card-meta{ font-size:11px; color:#999; margin-top:5px; }
  #empty{ text-align:center; color:#999; padding:40px 20px; font-size:14px; }

  .section-header{
    font-size:13px; font-weight:800;
    padding:14px 6px 6px;
    color:#555 !important;
    border-bottom:1px solid var(--line);
    margin-bottom:6px;
    position:sticky; top:112px;
    background:var(--paper);
  }

  #fab{
    position:fixed; right:18px; bottom:22px;
    width:56px; height:56px; border-radius:50%;
    background:var(--accent); color:#fff !important;
    border:none; font-size:28px; line-height:56px; text-align:center;
    box-shadow:0 4px 14px rgba(0,0,0,0.25);
    cursor:pointer;
  }

  #addModal, #viewModal{
    display:none;
    position:fixed; inset:0; background:var(--paper);
    z-index:100; overflow-y:auto;
  }
  .modal-header{
    position:sticky; top:0; background:var(--paper);
    border-bottom:1px solid var(--line);
    padding:14px 16px; display:flex; justify-content:space-between; align-items:center;
  }
  .modal-header h2{ font-size:16px; margin:0; }
  .close-btn{
    border:none; background:none; font-size:22px; cursor:pointer; color:var(--ink) !important;
    padding:0 4px;
  }
  .modal-body{ padding:16px; }
  label{ display:block; font-size:12px; font-weight:700; margin:14px 0 5px; color:#555 !important; }
  input[type=text], textarea, select{
    width:100%; padding:10px 12px; font-size:14px;
    border:1.5px solid var(--line); border-radius:8px; font-family:inherit;
    background:#fff; color:var(--ink) !important;
  }
  textarea{ min-height:160px; font-family:monospace; font-size:11px; resize:vertical; }
  .hint{ font-size:11px; color:#888 !important; margin-top:4px; }
  #saveBtn{
    width:100%; margin-top:20px; padding:13px;
    background:var(--accent); color:#fff !important; border:none;
    border-radius:10px; font-size:15px; font-weight:700; cursor:pointer;
  }
  #saveBtn:disabled{ opacity:0.5; }
  #saveMsg{ text-align:center; font-size:13px; margin-top:10px; color:#c1631a !important; }

  #viewFrame{ width:100%; height:calc(100vh - 54px); border:none; }
</style>
</head>
<body>

<header>
  <h1>📚 Project 280</h1>
  <input id="search" type="text" placeholder="Search charts (e.g. HELLP, sympatholytics)...">
  <div id="filterBar">
    <div class="filter-group-label">Clinical Science</div>
    <div id="tagBar"></div>
    <div class="filter-group-label">System</div>
    <div id="sysBar"></div>
  </div>
</header>

<div id="status">Connecting…</div>
<div id="list"></div>
<div id="empty" style="display:none;">No charts yet — tap + to add the first one.</div>

<button id="fab" onclick="openAdd()">+</button>

<!-- Add Chart Modal -->
<div id="addModal">
  <div class="modal-header">
    <h2>Add Chart</h2>
    <button class="close-btn" onclick="closeAdd()">✕</button>
  </div>
  <div class="modal-body">
    <label>Title</label>
    <input id="f_title" type="text" placeholder="e.g. Hypertensive Pregnancy Disorders">

    <label>Clinical Science</label>
    <select id="f_clinical">
      <option value="">Select…</option>
      <option>Medicine</option>
      <option>Pediatrics</option>
      <option>Obstetrics &amp; Gynecology</option>
      <option>Psychiatry</option>
      <option>Surgery</option>
    </select>

    <label>System</label>
    <select id="f_system">
      <option value="">Select…</option>
      <option>Nutrition</option>
      <option>Social Sciences: Legal/Ethical Issues &amp; Professionalism/Systems-based Practice &amp; Patient Safety</option>
      <option>Renal &amp; Urinary System &amp; Reproductive Systems</option>
      <option>Cardiovascular System</option>
      <option>Musculoskeletal System/Skin &amp; Subcutaneous Tissue</option>
      <option>Behavioral Health</option>
      <option>Blood &amp; Lymphoreticular/Immune Systems</option>
      <option>Gastrointestinal System</option>
      <option>Nervous System &amp; Special Senses</option>
      <option>Respiratory System</option>
      <option>Multisystem Processes &amp; Disorders</option>
      <option>Endocrine System</option>
      <option>Pregnancy, Childbirth &amp; the Puerperium</option>
      <option>Biostatistics &amp; Epidemiology/Population Health/Interpretation of Medical Literature</option>
      <option>Human Development**</option>
    </select>

    <label>Chart HTML</label>
    <textarea id="f_html" placeholder="Paste the full HTML content of the chart here"></textarea>
    <div class="hint">Paste the entire contents of the chart's .html file.</div>

    <label>Your name (optional)</label>
    <input id="f_author" type="text" placeholder="e.g. Reed">

    <button id="saveBtn" onclick="saveChart()">Save Chart</button>
    <div id="saveMsg"></div>
  </div>
</div>

<!-- View Chart Modal -->
<div id="viewModal">
  <div class="modal-header">
    <h2 id="viewTitle"></h2>
    <button class="close-btn" onclick="closeView()">✕</button>
  </div>
  <iframe id="viewFrame" sandbox="allow-same-origin"></iframe>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="app.js"></script>
</body>
</html>
